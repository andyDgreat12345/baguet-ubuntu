name: baguette-local
services:
  baguette:
    build:
      context: .
      dockerfile: linux/Dockerfile
    restart: unless-stopped
    init: false
    shm_size: 1gb
    ports:
      - "127.0.0.1:8766:8766"
      - "127.0.0.1:6080:6080"
    volumes:
      - baguette-data:/data
      - wechat-account:/home/baguette
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "/opt/baguette/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
  ollama:
    image: ollama/ollama:0.40.13
    restart: unless-stopped
    volumes:
      - local-models:/root/.ollama
volumes:
  baguette-data:
  wechat-account:
  local-models:
